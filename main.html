<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCIAL - Main Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    .user-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 15px auto;
      border: 3px solid #38bdf8;
      object-fit: cover;
    }
    .logout-btn {
      margin-top: 25px;
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="dashboard-card">
      <h1 class="brand-logo">SOCIAL</h1>
      <img id="avatar" class="user-avatar" src="https://via.placeholder.com/90" alt="Profile" style="display: none;">
      <h2 id="welcome-msg" style="color: #ffffff; margin-top: 10px;">Loading Session...</h2>
      <p id="user-info" style="color: #94a3b8; font-size: 0.95rem; margin-top: 5px;"></p>

      <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBeHQHMKOfatuzl-e3a9l3ATxZxCMhJQFo",
      authDomain: "social-app-6cffa.firebaseapp.com",
      projectId: "social-app-6cffa",
      storageBucket: "social-app-6cffa.appspot.com",
      messagingSenderId: "880716821433",
      appId: "1:880716821433:web:714ce9a6df235643527c68"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.addEventListener('DOMContentLoaded', () => {
      const welcomeMsg = document.getElementById('welcome-msg');
      const userInfo = document.getElementById('user-info');
      const avatar = document.getElementById('avatar');
      const logoutBtn = document.getElementById('logout-btn');

      // Check Discord Token in URL Fragment
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const discordToken = hashParams.get('access_token');

      if (discordToken) {
        localStorage.setItem('discord_token', discordToken);
        window.history.replaceState(null, null, window.location.pathname);
      }

      const savedDiscordToken = localStorage.getItem('discord_token');

      if (savedDiscordToken) {
        fetch('https://discord.com/api/users/@me', {
          headers: { authorization: `Bearer ${savedDiscordToken}` }
        })
        .then(res => res.json())
        .then(user => {
          if (user.id) {
            welcomeMsg.innerText = `Welcome, ${user.username}!`;
            userInfo.innerText = user.email ? `Email: ${user.email}` : `Discord ID: ${user.id}`;
            if (user.avatar) {
              avatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
              avatar.style.display = 'block';
            }
          } else {
            clearDiscordSession();
          }
        })
        .catch(() => clearDiscordSession());
      } else {
        onAuthStateChanged(auth, (user) => {
          if (user) {
            welcomeMsg.innerText = `Welcome Back!`;
            userInfo.innerText = `Email: ${user.email}`;
          } else {
            window.location.href = 'rglg.html';
          }
        });
      }

      logoutBtn.addEventListener('click', () => {
        if (localStorage.getItem('discord_token')) {
          clearDiscordSession();
        } else {
          signOut(auth).then(() => {
            window.location.href = 'rglg.html';
          });
        }
      });

      function clearDiscordSession() {
        localStorage.removeItem('discord_token');
        window.location.href = 'rglg.html';
      }
    });
  </script>
</body>
</html>
