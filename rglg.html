<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCIAL - Register & Login</title>
  <!-- Single Common Style File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Opening Animation Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="glow-ring"></div>
      <h1 class="loader-logo">SOCIAL</h1>
      <p class="loader-text">Loading experience...</p>
    </div>
  </div>

  <!-- Main Auth Box -->
  <div class="auth-wrapper hidden" id="auth-wrapper">
    <div class="auth-card">
      <h1 class="brand-logo">SOCIAL</h1>
      <p class="brand-tagline">Connect with the world</p>

      <!-- Toggle Buttons -->
      <div class="tab-switch">
        <button id="tab-login" class="active" onclick="switchForm('login')">Login</button>
        <button id="tab-register" onclick="switchForm('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="form-content" onsubmit="onLoginSubmit(event)">
        <h2>Welcome Back</h2>
        <div class="input-field">
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="input-field">
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="action-btn">Login</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="form-content hidden" onsubmit="onRegisterSubmit(event)">
        <h2>Create Account</h2>
        <div class="input-field">
          <input type="text" placeholder="Full Name" required>
        </div>
        <div class="input-field">
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="input-field">
          <input type="password" placeholder="Password" required>
        </div>
        <div class="input-field">
          <input type="password" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="action-btn">Register</button>
      </form>

    </div>
  </div>

  <!-- Single Common Script File -->
  <script src="script.js"></script>
</body>
</html>
