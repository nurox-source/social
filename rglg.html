<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCIAL - Register & Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Animation Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="glow-ring"></div>
      <h1 class="loader-logo">SOCIAL</h1>
      <p class="loader-text">Loading experience...</p>
    </div>
  </div>

  <!-- Custom Central Alert Box -->
  <div id="alert-box" class="alert-box hidden">
    <span id="alert-message"></span>
  </div>

  <!-- Auth Card -->
  <div class="auth-wrapper hidden" id="auth-wrapper">
    <div class="auth-card">
      <h1 class="brand-logo">SOCIAL</h1>
      <p class="brand-tagline">Connect with the world</p>

      <!-- Toggle Buttons (কোনো onclick নেই) -->
      <div class="tab-switch">
        <button id="tab-register" class="active">Register</button>
        <button id="tab-login">Login</button>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="form-content">
        <h2>Create Account</h2>
        <div class="input-field">
          <input type="text" id="reg-name" placeholder="Full Name" required>
        </div>
        <div class="input-field">
          <input type="email" id="reg-email" placeholder="Email Address" required>
        </div>
        <div class="input-field">
          <input type="password" id="reg-password" placeholder="Password" required>
        </div>
        <div class="input-field">
          <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="action-btn">Register</button>
      </form>

      <!-- Login Form -->
      <form id="login-form" class="form-content hidden">
        <h2>Welcome Back</h2>
        <div class="input-field">
          <input type="email" id="login-email" placeholder="Email Address" required>
        </div>
        <div class="input-field">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="action-btn">Login</button>
      </form>

      <!-- Google Sign-In Button -->
      <div class="divider">
        <span>OR</span>
      </div>
      <button class="google-btn" id="google-btn" type="button">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
        Continue with Google
      </button>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
